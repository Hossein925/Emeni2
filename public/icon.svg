<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e60c8" />
      <stop offset="100%" stop-color="#0f459e" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" />
  
  <!-- Subtle Shadow Object -->
  <path d="M 170,180 C 170,140 210,120 256,120 C 302,120 342,140 342,180 C 342,210 310,230 256,230 C 202,230 170,210 170,180 Z" fill="#0b357e" opacity="0.3" />

  <!-- Person Head -->
  <circle cx="294" cy="180" r="42" fill="#ffffff" filter="url(#dropShadow)" />
  
  <!-- Person Body Shoulder -->
  <path d="M 230,280 C 230,230 358,230 358,280 L 358,295 C 358,305 350,312 340,312 L 248,312 C 238,312 230,305 230,295 Z" fill="#ffffff" filter="url(#dropShadow)" />

  <!-- Plus Badge Circle -->
  <circle cx="360" cy="260" r="32" fill="#ffffff" filter="url(#dropShadow)" />
  <circle cx="360" cy="260" r="28" fill="#1e60c8" />
  <path d="M 360,244 L 360,276 M 344,260 L 376,260" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />

  <!-- Caring Supporting Hand -->
  <path d="M 130,295 C 170,280 230,285 300,325 C 340,348 375,325 390,300 C 392,296 385,290 380,292 C 340,312 315,302 270,282 C 215,258 170,270 130,295 Z" fill="#ffffff" filter="url(#dropShadow)" />
  <path d="M 125,290 C 175,270 235,280 300,312 C 340,332 370,308 385,292 C 340,325 305,320 250,298 C 190,274 150,282 125,290 Z" fill="#ffffff" />
  
  <!-- Lower Hand Palm -->
  <path d="M 120,295 C 120,295 180,380 290,380 C 340,380 375,340 390,300 C 370,330 330,365 280,365 C 180,365 130,305 120,295 Z" fill="#ffffff" opacity="0.9" />
</svg>
